name: Bug report
description: Report a reproducible problem with the game or build.
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
      description: Give the shortest set of steps that reproduces the problem.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.0 or commit SHA

  - type: input
    id: system
    attributes:
      label: Windows version

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add anything useful for diagnosing the issue.
