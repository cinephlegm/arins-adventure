name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arins-adventure-executable
          path: build/Release/ArinsAdventure.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arins-adventure-executable
          path: _build

      - name: Checkout licensed runtime assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cinephlegm/arins-adventure-assets
          ref: release-assets
          token: ${{ secrets.ARINS_ASSETS_TOKEN }}
          path: _assets
          persist-credentials: false

      - name: Package Windows build
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $packageName = "Arins-Adventure-$tag-Windows"
          $packageRoot = Join-Path 'dist' $packageName

          foreach ($dir in @('audio', 'map', 'sprite')) {
            if (-not (Test-Path (Join-Path '_assets' $dir))) {
              throw "Missing runtime asset directory: $dir"
            }
          }

          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          Copy-Item '_build/ArinsAdventure.exe' $packageRoot
          Copy-Item '_assets/audio' $packageRoot -Recurse
          Copy-Item '_assets/map' $packageRoot -Recurse
          Copy-Item '_assets/sprite' $packageRoot -Recurse
          Copy-Item 'README.md' $packageRoot
          Copy-Item 'THIRD_PARTY_NOTICES.md' $packageRoot
          Copy-Item 'ASSETS.md' $packageRoot

          $zip = Join-Path 'dist' "$packageName.zip"
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content 'dist/SHA256SUMS.txt'

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag "dist/Arins-Adventure-$tag-Windows.zip" "dist/SHA256SUMS.txt" --verify-tag --generate-notes --title "Arin's Adventure $tag"
